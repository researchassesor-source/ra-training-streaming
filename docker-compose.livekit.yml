services:
  livekit:
    image: livekit/livekit-server:v1.13.1
    command: ["--config", "/etc/livekit/livekit.yaml", "--bind", "0.0.0.0"]
    volumes:
      - ./livekit.local.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped
