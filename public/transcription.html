<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Transcripción · R.A. Training Streaming</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/streaming-app-logo-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/streaming-app-logo-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dashboard-body transcript-body">
  <header class="dashboard-topbar"><div id="brand"></div><a class="button secondary" href="/dashboard.html">Volver al panel</a></header>
  <main class="transcript-shell">
    <div id="transcriptNotice" class="notice" hidden role="status" aria-live="polite"></div>
    <section class="transcript-header dashboard-card" aria-labelledby="transcriptTitle">
      <div class="transcript-title-row">
        <div><p class="eyebrow">Transcripción de reunión</p><h1 id="transcriptTitle">Cargando…</h1><p id="transcriptMeta" class="muted"></p></div>
        <img src="assets/streaming-app-logo-192.png" alt="Icono de R.A. Training Streaming" />
      </div>
      <div class="transcript-status-row"><span id="transcriptStatus" class="status-pill">En cola</span><span id="transcriptLanguage"></span><span id="transcriptParticipants"></span><span id="unsavedBadge" class="warning-pill" hidden>Cambios sin guardar</span></div>
      <div id="transcriptProgressTrack" class="progress-track" role="progressbar" aria-label="Progreso de transcripción" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="transcriptProgress"></span></div><p id="transcriptProgressLabel" class="muted small"></p>
      <p class="privacy-notice">La transcripción automática puede contener errores. Revisa nombres, cifras y términos importantes antes de compartirla.</p>
    </section>

    <section class="transcript-toolbar dashboard-card" aria-label="Herramientas de transcripción">
      <label>Buscar<input id="transcriptSearch" type="search" placeholder="Buscar en el texto" /></label>
      <label>Participante<select id="speakerFilter"><option value="">Todos</option></select></label>
      <div class="transcript-actions">
        <button id="copyTranscript" class="secondary" type="button">Copiar texto</button>
        <button id="editTranscript" class="secondary manage-transcript" type="button">Editar</button>
        <button id="saveTranscript" class="primary manage-transcript" type="button" hidden>Guardar cambios</button>
        <button id="cancelEdit" class="secondary manage-transcript" type="button" hidden>Descartar edición</button>
        <button id="retryTranscript" class="secondary manage-transcript" type="button">Regenerar</button>
        <button id="cancelTranscript" class="secondary manage-transcript" type="button" hidden>Cancelar trabajo</button>
        <button id="deleteTranscript" class="danger manage-transcript" type="button">Eliminar</button>
      </div>
      <div class="export-actions" aria-label="Descargar transcripción">
        <span>Descargar:</span><a data-export="txt">TXT</a><a data-export="json">JSON</a><a data-export="vtt">VTT</a><a data-export="srt">SRT</a>
      </div>
    </section>

    <section class="transcript-content dashboard-card" aria-labelledby="segmentsTitle">
      <div class="card-heading"><h2 id="segmentsTitle">Intervenciones</h2><a id="openRecording" class="button secondary compact" target="_blank" rel="noopener noreferrer" hidden>Abrir grabación</a></div>
      <div id="transcriptSegments" class="transcript-segments" aria-live="polite"></div>
    </section>
  </main>

  <dialog id="transcriptConfirmDialog" class="app-dialog confirmation-dialog"><form method="dialog"><h2 data-confirm-title>Confirmar acción</h2><p data-confirm-message></p><div class="dialog-actions"><button class="secondary" value="cancel">Cancelar</button><button data-confirm-accept class="danger" value="confirm">Confirmar</button></div></form></dialog>
  <script src="brand.js"></script>
  <script src="app-core.js"></script>
  <script src="transcription.js"></script>
</body>
</html>
