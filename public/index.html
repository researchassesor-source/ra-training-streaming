<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Research Assessor & Training Streaming</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="landing">
    <img id="mascot" class="mascot" alt="" hidden />
    <div class="brand" id="brand"></div>
    <h1>Panel de organizador</h1>
    <p class="status-line" id="msg">Las sesiones son exclusivas: solo un organizador puede crearlas y compartir el enlace de acceso.</p>

    <label for="username">Usuario</label>
    <input id="username" autocomplete="username" />

    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" />

    <div class="actions">
      <button id="btnLogin">Entrar</button>
    </div>
  </div>

  <script src="brand.js"></script>
  <script>
    renderBrand(document.getElementById('brand'));

    const mascot = document.getElementById('mascot');
    mascot.onerror = () => { mascot.hidden = true; };
    mascot.onload = () => { mascot.hidden = false; };
    mascot.src = 'assets/mascot.png';

    if (localStorage.getItem('ratToken')) {
      window.location.href = 'dashboard.html';
    }

    const msg = document.getElementById('msg');
    const defaultMsg = msg.textContent;

    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) {
        msg.textContent = 'Completa usuario y contraseña.';
        return;
      }
      msg.textContent = 'Ingresando…';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'error desconocido');
        localStorage.setItem('ratToken', data.token);
        localStorage.setItem('ratUsername', data.username);
        window.location.href = 'dashboard.html';
      } catch (err) {
        msg.textContent = 'Error: ' + err.message;
        setTimeout(() => { msg.textContent = defaultMsg; }, 4000);
      }
    }

    document.getElementById('btnLogin').onclick = login;
    document.getElementById('password').addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') login();
    });
  </script>
</body>
</html>
