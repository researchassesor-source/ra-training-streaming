<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Asistente · R.A. Training Streaming</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="room-body" data-page-role="viewer">
  <header class="room-topbar">
    <div id="brand"></div>
    <div class="room-title-block"><strong id="meetingTitle">Reunión</strong><span id="trainerName"></span></div>
    <div class="room-statuses"><span id="recordingBadge" class="recording-badge" hidden>Grabando</span><span id="participantCount">1 participante</span><span id="connectionStatus" class="connection-status" aria-live="polite">Validando invitación…</span></div>
  </header>
  <main class="room-layout">
    <section class="room-stage" aria-label="Escenario de video">
      <div id="stageGrid" class="stage-grid"></div>
    </section>
    <aside id="sidePanel" class="room-side-panel" aria-label="Panel de colaboración">
      <div class="room-tabs" role="tablist">
        <button type="button" role="tab" aria-selected="true" data-room-tab="chat">Chat <span id="chatUnread" class="tab-count" hidden></span></button>
        <button type="button" role="tab" aria-selected="false" data-room-tab="questions">Preguntas <span id="questionUnread" class="tab-count" hidden></span></button>
        <button type="button" role="tab" aria-selected="false" data-room-tab="participants">Participantes <span id="handCount" class="tab-count" hidden></span></button>
      </div>
      <section class="room-tab-panel active" data-room-panel="chat">
        <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
      </section>
      <section class="room-tab-panel" data-room-panel="questions">
        <div id="questionMessages" class="chat-messages" aria-live="polite"></div>
      </section>
      <section class="room-tab-panel" data-room-panel="participants">
        <div id="handQueue" class="hand-queue"></div>
        <div id="participantsList" class="participants-list"></div>
      </section>
      <div class="room-chat-composer">
        <p id="uploadStatus" class="upload-progress" aria-live="polite"></p>
        <form id="chatForm">
          <select id="chatKind" aria-label="Tipo de mensaje"><option value="chat">Chat</option><option value="question">Pregunta</option></select>
          <input id="chatInput" autocomplete="off" maxlength="2000" placeholder="Escribe un mensaje…" aria-label="Mensaje" />
          <button id="emojiBtn" class="composer-icon" type="button" aria-label="Abrir reacciones">Reacción</button>
          <button id="fileBtn" class="composer-icon" type="button" aria-label="Adjuntar archivo">Adjuntar</button>
          <input id="fileInput" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf,.txt" hidden />
          <button class="primary compact" type="submit">Enviar</button>
          <div id="emojiPicker" class="emoji-picker" hidden></div>
        </form>
      </div>
    </aside>
  </main>
  <nav id="roomControls" class="room-controls" aria-label="Controles de reunión">
    <button id="btnMic" type="button" aria-pressed="false"><span class="control-symbol" aria-hidden="true">M</span><span>Micrófono</span></button>
    <button id="btnCam" type="button" aria-pressed="false"><span class="control-symbol" aria-hidden="true">C</span><span>Cámara</span></button>
    <button id="btnChat" type="button" aria-pressed="true"><span class="control-symbol" aria-hidden="true">Ch</span><span>Chat</span></button>
    <button id="btnHand" type="button" aria-pressed="false"><span class="control-symbol" aria-hidden="true">↑</span><span>Mano</span></button>
    <button id="btnMore" type="button" aria-expanded="false"><span class="control-symbol" aria-hidden="true">···</span><span>Más</span></button>
    <button id="btnLeave" class="danger-control" type="button"><span class="control-symbol" aria-hidden="true">×</span><span>Salir</span></button>
  </nav>
  <div id="morePanel" class="more-panel" hidden>
    <div class="panel-heading"><h2>Más opciones</h2><button id="closeMore" class="icon-action" type="button" aria-label="Cerrar opciones">×</button></div>
    <div class="more-grid">
      <button id="btnScreen" type="button">Compartir pantalla</button>
      <button id="btnEffects" type="button">Efectos de cámara</button>
      <button id="btnParticipants" type="button">Participantes</button>
      <button id="btnFloat" type="button" aria-pressed="false">Panel siempre encima</button>
      <button id="btnRecord" class="organizer-control" type="button">Iniciar grabación</button>
      <button id="btnEnd" class="organizer-control danger" type="button">Finalizar para todos</button>
      <button id="btnNotifications" type="button">Activar notificaciones</button>
      <button id="btnSoundToggle" type="button" aria-pressed="true">Sonido activo</button>
    </div>
    <div id="effectsPanel" class="effects-panel" hidden>
      <button type="button" data-camera-effect="none">Sin efecto</button>
      <button type="button" data-camera-effect="blur">Desenfoque</button>
      <label class="button secondary compact">Fondo personalizado<input id="backgroundImageInput" type="file" accept="image/jpeg,image/png,image/webp" hidden /></label>
    </div>
    <div class="device-grid">
      <label>Cámara<select id="cameraSelect"></select></label>
      <label>Micrófono<select id="microphoneSelect"></select></label>
      <label>Altavoz<select id="speakerSelect"></select></label>
    </div>
    <details><summary>Preferencias de alertas</summary><div id="soundSettings" class="sound-settings"></div></details>
    <p id="featureMessage" class="muted" aria-live="polite"></p>
  </div>
  <dialog id="preflightDialog" class="app-dialog preflight-dialog">
    <form id="preflightForm" method="dialog">
      <p class="eyebrow">Sala de preparación</p>
      <h1 id="preflightTitle">Antes de entrar</h1>
      <p id="preflightMeeting" class="muted"></p>
      <div class="preflight-grid">
        <div class="preview-wrap"><video id="previewVideo" autoplay muted playsinline></video><div id="previewPlaceholder">La vista previa aparecerá aquí.</div></div>
        <div class="preflight-fields">
          <label>Nombre visible<input id="displayNameInput" maxlength="80" autocomplete="name" required /></label>
          <button id="previewButton" class="secondary" type="button">Activar vista previa y probar micrófono</button>
          <label>Cámara<select id="preflightCamera"></select></label>
          <label>Micrófono<select id="preflightMicrophone"></select></label>
          <label>Altavoz<select id="preflightSpeaker"></select></label>
          <div class="meter" aria-label="Nivel de micrófono"><span id="microphoneMeter"></span></div>
          <p id="networkStatus" class="muted"></p>
          <label class="check-row presenter-option"><input id="joinCamera" type="checkbox" /> Entrar con cámara</label>
          <label class="check-row presenter-option"><input id="joinMicrophone" type="checkbox" /> Entrar con micrófono</label>
          <label class="check-row viewer-option"><input id="privacyConsent" type="checkbox" required /> Leí el aviso de privacidad y acepto participar.</label>
          <label class="check-row viewer-option" id="recordingConsentLabel"><input id="recordingConsent" type="checkbox" /> Entiendo que la reunión puede ser grabada.</label>
        </div>
      </div>
      <p id="preflightError" class="form-error" role="alert"></p>
      <div class="dialog-actions"><a class="button secondary" href="/index.html">Cancelar</a><button id="enterRoomButton" class="primary" type="submit">Entrar a la reunión</button></div>
    </form>
  </dialog>
  <script src="brand.js"></script>
  <script src="app-core.js"></script>
  <script src="sounds.js"></script>
  <script src="floating-bar.js"></script>
  <script src="/vendor/livekit-client/livekit-client.umd.js"></script>
  <script src="access.js"></script>
  <script src="stage.js"></script>
  <script src="connection.js"></script>
  <script src="chat.js"></script>
  <script src="room-ui.js"></script>
</body>
</html>
