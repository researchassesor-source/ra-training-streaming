<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Espectador · Research Assessor & Training Streaming</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand" id="brand"></div>
    <div class="topbar-right">
      <span class="badge" id="recordingBadge" style="display:none; background:#5c1a1a; color:#ff8a8a;">🔴 grabando</span>
      <button id="btnSoundToggle" class="secondary badge-btn" title="Silenciar sonidos">🔊</button>
      <button id="btnChatToggle" class="secondary badge-btn" title="Mostrar/ocultar chat">💬</button>
      <span class="badge clickable" id="countBadge">👥 1 conectado</span>
      <span class="badge" id="statusBadge">conectando…</span>
    </div>
  </div>
  <div class="layout">
    <div class="stage">
      <div class="stage-grid" id="stageGrid"></div>
      <div class="controls" id="controlsPanel">
        <button id="btnRaiseHand" class="icon-btn accent"><span class="icon">✋</span><span class="label">Pedir palabra</span></button>
        <button id="btnLowerHand" class="icon-btn secondary" hidden><span class="icon">🖐️⬇</span><span class="label">Bajar mano</span></button>
        <button id="btnCam" class="icon-btn" hidden><span class="icon">📷</span><span class="label">Cámara</span></button>
        <button id="btnMic" class="icon-btn secondary" hidden><span class="icon">🎤</span><span class="label">Micrófono</span></button>
        <button id="btnLeave" class="icon-btn danger"><span class="icon">🚪</span><span class="label">Salir</span></button>
      </div>
    </div>
    <div class="chat" id="chatPanel">
      <h2>Chat en vivo</h2>
      <div class="chat-messages" id="chatMessages"></div>
      <p class="upload-progress" id="uploadStatus"></p>
      <form class="chat-form" id="chatForm">
        <input id="chatInput" autocomplete="off" placeholder="Escribe un mensaje…" />
        <div class="chat-tools">
          <button type="button" id="emojiBtn" title="Emoji">😀</button>
          <button type="button" id="fileBtn" title="Adjuntar archivo">📎</button>
          <input type="file" id="fileInput" hidden />
          <div class="emoji-picker" id="emojiPicker" hidden></div>
        </div>
        <button type="submit">Enviar</button>
      </form>
    </div>
  </div>

  <script src="brand.js"></script>
  <script src="sounds.js"></script>
  <script src="/vendor/livekit-client/livekit-client.umd.js"></script>
  <script src="access.js"></script>
  <script src="stage.js"></script>
  <script src="connection.js"></script>
  <script src="chat.js"></script>
  <script>
    renderBrand(document.getElementById('brand'), { tagline: false });
    attachSoundToggle(document.getElementById('btnSoundToggle'));
    const params = new URLSearchParams(location.search);
    const roomName = params.get('room') || 'webinar-demo';
    let identity = params.get('name') || '';
    const initialCode = params.get('code') || '';

    const statusBadge = document.getElementById('statusBadge');
    const countBadge = document.getElementById('countBadge');
    const btnLeave = document.getElementById('btnLeave');
    const btnRaiseHand = document.getElementById('btnRaiseHand');
    const btnLowerHand = document.getElementById('btnLowerHand');
    const btnCam = document.getElementById('btnCam');
    const btnMic = document.getElementById('btnMic');

    const chatPanel = document.getElementById('chatPanel');
    const btnChatToggle = document.getElementById('btnChatToggle');
    let chatVisible = true;
    let unreadChat = 0;
    function updateChatBadge() {
      btnChatToggle.textContent = unreadChat > 0 ? `💬 ${unreadChat}` : '💬';
    }
    btnChatToggle.onclick = () => {
      chatVisible = !chatVisible;
      chatPanel.classList.toggle('chat-hidden', !chatVisible);
      if (chatVisible) { unreadChat = 0; updateChatBadge(); }
    };

    const controlsPanel = document.getElementById('controlsPanel');
    const stage = createStage(
      document.getElementById('stageGrid'),
      'Esperando a que el presentador inicie…',
      (spotlight) => {
        chatPanel.classList.toggle('floating', spotlight);
        controlsPanel.classList.toggle('floating', spotlight);
      }
    );

    // Mirrors presenter.html: if a viewer fullscreens the shared-screen tile,
    // chat and controls move inside it so they stay usable.
    document.addEventListener('fullscreenchange', () => {
      const fsEl = document.fullscreenElement;
      if (fsEl && fsEl.classList.contains('tile')) {
        fsEl.appendChild(chatPanel);
        fsEl.appendChild(controlsPanel);
        chatPanel.classList.add('floating', 'in-fullscreen');
        chatPanel.classList.remove('chat-hidden');
        controlsPanel.classList.add('floating', 'in-fullscreen');
      } else {
        document.querySelector('.layout').appendChild(chatPanel);
        document.querySelector('.stage').appendChild(controlsPanel);
        chatPanel.classList.remove('in-fullscreen');
        chatPanel.classList.toggle('floating', document.getElementById('stageGrid').classList.contains('has-spotlight'));
        chatPanel.classList.toggle('chat-hidden', !chatVisible);
        controlsPanel.classList.remove('in-fullscreen');
        controlsPanel.classList.toggle('floating', document.getElementById('stageGrid').classList.contains('has-spotlight'));
      }
    });

    let camOn = false;
    let micOn = false;
    let canSpeak = false;
    let handState = 'idle'; // idle | pending | granted

    const room = new LivekitClient.Room();
    attachRemoteStageEvents(room, stage);

    function label() {
      return `conectado · sala "${roomName}"`;
    }

    function setLabel(btn, text) {
      const el = btn.querySelector('.label');
      if (el) el.textContent = text;
    }

    function renderHandState() {
      if (handState === 'granted') {
        btnRaiseHand.hidden = true;
        btnLowerHand.hidden = false;
        btnCam.hidden = false;
        btnMic.hidden = false;
      } else {
        btnRaiseHand.hidden = false;
        btnLowerHand.hidden = true;
        btnCam.hidden = true;
        btnMic.hidden = true;
        btnRaiseHand.disabled = false;
        if (handState === 'pending') {
          setLabel(btnRaiseHand, 'Cancelar');
          btnRaiseHand.classList.add('active');
        } else {
          setLabel(btnRaiseHand, 'Pedir palabra');
          btnRaiseHand.classList.remove('active');
        }
      }
    }

    function onPermissionsChanged() {
      const allowed = Boolean(room.localParticipant.permissions?.canPublish);
      canSpeak = allowed;
      handState = allowed ? 'granted' : 'idle';
      if (!allowed) {
        if (camOn) { camOn = false; room.localParticipant.setCameraEnabled(false); stage.removeTrack(identity, 'camera'); setLabel(btnCam, 'Cámara'); btnCam.classList.remove('active'); }
        if (micOn) { micOn = false; room.localParticipant.setMicrophoneEnabled(false); setLabel(btnMic, 'Micrófono'); btnMic.classList.remove('active'); }
      }
      renderHandState();
    }

    room.on(LivekitClient.RoomEvent.ParticipantPermissionsChanged, (prev, participant) => {
      if (participant.identity === identity) onPermissionsChanged();
    });

    btnRaiseHand.onclick = () => {
      const encoder = new TextEncoder();
      if (handState === 'idle') {
        room.localParticipant.publishData(
          encoder.encode(JSON.stringify({ kind: 'hand-raise', identity })),
          { reliable: true }
        );
        handState = 'pending';
      } else if (handState === 'pending') {
        room.localParticipant.publishData(
          encoder.encode(JSON.stringify({ kind: 'hand-lower', identity })),
          { reliable: true }
        );
        handState = 'idle';
      }
      renderHandState();
    };

    btnLowerHand.onclick = async () => {
      btnLowerHand.disabled = true;
      try {
        await fetch('/api/participants/demote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ room: roomName, panelistIdentity: identity, targetIdentity: identity }),
        });
        // The server-side permission change fires ParticipantPermissionsChanged, which updates the UI.
      } catch (err) {
        console.error(err);
      } finally {
        btnLowerHand.disabled = false;
      }
    };

    btnCam.onclick = async () => {
      camOn = !camOn;
      await room.localParticipant.setCameraEnabled(camOn);
      setLabel(btnCam, camOn ? 'Apagar' : 'Cámara');
      btnCam.classList.toggle('active', camOn);
      const pub = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera);
      if (camOn && pub?.track) stage.setTrack(identity, `${identity} (tú)`, 'camera', pub.track, { muted: true });
      else stage.removeTrack(identity, 'camera');
    };

    btnMic.onclick = async () => {
      micOn = !micOn;
      await room.localParticipant.setMicrophoneEnabled(micOn);
      setLabel(btnMic, micOn ? 'Silenciar' : 'Micrófono');
      btnMic.classList.toggle('active', micOn);
    };

    async function main() {
      if (!identity) identity = await promptName('espectadores');
      const data = await requestToken({ room: roomName, identity, role: 'viewer', initialCode });
      await room.connect(data.wsUrl, data.token);
      statusBadge.textContent = label();
      statusBadge.className = 'badge live';
      attachConnectionUI(room, { statusBadge, countBadge, getLabel: label });
      setupChat(room, identity, {
        roomName,
        onMessage: () => {
          if (!chatVisible) { unreadChat++; updateChatBadge(); }
        },
      });
      playConnectedSound();
      onRecordingStatus(room, (active) => {
        document.getElementById('recordingBadge').style.display = active ? 'inline' : 'none';
      });
      onPermissionsChanged();
    }

    btnLeave.onclick = async () => {
      await room.disconnect();
      window.location.href = 'index.html';
    };

    main().catch((err) => {
      console.error(err);
      statusBadge.textContent = 'error de conexión';
    });
  </script>
</body>
</html>
