<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Acceso a capacitación | R.A. Training Streaming</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css?v=series-simple-access-final" />
</head>
<body class="series-access-body simple-series-access">
  <main class="series-simple-shell" aria-live="polite">
    <section id="phaseCard" class="series-simple-card" aria-labelledby="seriesTitle">
      <div id="brand" class="series-simple-brand"></div>
      <span id="seriesSessionBadge" class="series-session-badge">Sesión</span>
      <h1 id="seriesTitle">Validando acceso...</h1>
      <p id="seriesTrainer" class="series-trainer"></p>
      <p id="seriesSchedule" class="series-simple-meta"></p>
      <p id="phaseEyebrow" class="eyebrow">Comenzamos en</p>
      <h2 id="phaseTitle" class="series-live-title">Cargando...</h2>
      <p id="phaseCountdown" class="series-countdown"></p>
      <p id="phaseMessage" class="muted"></p>

      <form id="seriesAccessForm" class="series-simple-form">
        <label for="participantName">Nombre visible</label>
        <input id="participantName" maxlength="80" autocomplete="name" required />
        <p class="series-privacy-line">Al continuar, aceptas el <span>aviso de privacidad</span> y participar en la capacitación.</p>
        <button id="confirmAccessButton" class="primary" type="submit">CONFIRMAR ACCESO</button>
      </form>

      <div id="preparedState" class="series-prepared-state" hidden>
        <div class="series-ready-mark" aria-hidden="true">✓</div>
        <strong id="preparedTitle">Todo listo</strong>
        <p id="preparedMessage" class="muted">Tu acceso está preparado.</p>
        <button id="changeNameButton" class="text-button" type="button">Cambiar nombre</button>
      </div>

      <button id="enterButton" class="primary series-enter-button" type="button" hidden>ENTRAR A LA REUNIÓN</button>
      <p id="seriesFeedback" class="muted" role="status"></p>
    </section>
  </main>
  <script src="brand.js"></script>
  <script src="app-core.js"></script>
  <script src="series-access.js"></script>
</body>
</html>
