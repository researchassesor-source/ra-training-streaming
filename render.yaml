services:
  - type: web
    name: ra-training-streaming-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: DATA_BACKEND
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: INVITATION_HASH_SECRET
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_WS_URL
        sync: false
      - key: RECORDING_S3_ACCESS_KEY
        sync: false
      - key: RECORDING_S3_SECRET_KEY
        sync: false
      - key: RECORDING_S3_BUCKET
        sync: false
      - key: RECORDING_S3_REGION
        sync: false
      - key: RECORDING_S3_ENDPOINT
        sync: false
      - key: TRANSCRIPTION_ENABLED
        sync: false
      - key: TRANSCRIPTION_PROVIDER
        sync: false
      - key: TRANSCRIPTION_API_KEY
        sync: false
      - key: TRANSCRIPTION_API_URL
        sync: false
      - key: TRANSCRIPTION_ALLOWED_HOSTS
        sync: false
  - type: worker
    name: ra-training-streaming-worker
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        sync: false
      - key: DATA_BACKEND
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: INVITATION_HASH_SECRET
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_WS_URL
        sync: false
      - key: RECORDING_S3_ACCESS_KEY
        sync: false
      - key: RECORDING_S3_SECRET_KEY
        sync: false
      - key: RECORDING_S3_BUCKET
        sync: false
      - key: RECORDING_S3_REGION
        sync: false
      - key: RECORDING_S3_ENDPOINT
        sync: false
      - key: TRANSCRIPTION_ENABLED
        sync: false
      - key: TRANSCRIPTION_PROVIDER
        sync: false
      - key: TRANSCRIPTION_API_KEY
        sync: false
      - key: TRANSCRIPTION_API_URL
        sync: false
      - key: TRANSCRIPTION_ALLOWED_HOSTS
        sync: false
      - key: WORKER_CONCURRENCY
        sync: false
      - key: JOB_POLL_INTERVAL_MS
        sync: false
      - key: JOB_LEASE_MS
        sync: false
      - key: JOB_HEARTBEAT_INTERVAL_MS
        sync: false
